<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Semantic Tab Finder</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 360px;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
    }
    #search {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #888;
      border-radius: 6px;
    }
    #status {
      margin: 8px 2px;
      font-size: 12px;
      opacity: 0.7;
      min-height: 1em;
    }
    #results {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 320px;
      overflow-y: auto;
    }
    .result {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
      text-align: left;
      padding: 8px 10px;
      margin-bottom: 4px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      font: inherit;
    }
    .result:hover { border-color: #888; }
    .result.selected {
      border-color: #4c8dff;
      background: rgba(76, 141, 255, 0.12);
    }
    .title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .url {
      font-size: 12px;
      opacity: 0.65;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <input id="search" type="text" placeholder="Search tabs by meaning…" autocomplete="off"
         role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" />
  <div id="status" role="status"></div>
  <ul id="results" role="listbox" aria-label="Matching tabs"></ul>
  <script type="module" src="popup.js"></script>
</body>
</html>
